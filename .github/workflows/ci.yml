name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: faro
          POSTGRES_PASSWORD: faro
          POSTGRES_DB: faro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faro -d faro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://faro:faro@localhost:5432/faro
      LLM_PROVIDER: fake
      EMBEDDING_PROVIDER: fake
      REQUIRE_POSTGRES: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Tests
        working-directory: backend
        run: pytest -q

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Imagen de API y worker
        run: docker build -t faro-api ./backend
      - name: Imagen del frontend
        run: docker build -t faro-frontend ./frontend
